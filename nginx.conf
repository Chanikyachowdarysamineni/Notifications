# Nginx Configuration for CSE HUB (Production)
# Deploying at subpath /csebro/

limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=1000r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

server {
    listen 80;
    server_name 160.187.169.41; # Or your future domain name

    # Connection and Request Rate Limiting at Nginx Level
    limit_req zone=req_limit_per_ip burst=2000 nodelay;
    limit_conn conn_limit_per_ip 50;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Static Files
    location /csebro/ {
        # Path to your built frontend (dist folder)
        alias /var/www/cse-hub/client/dist/; 
        try_files $uri $uri/ /csebro/index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Backend API Proxy
    location /csebro/api/ {
        # Strip /csebro from the request before sending it to the backend Node app
        # Because our Node app is expecting /api/... not /csebro/api/...
        rewrite ^/csebro/api/(.*)$ /api/$1 break;
        
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
